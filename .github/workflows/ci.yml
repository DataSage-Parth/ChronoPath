name: CI — ChronoPath

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Train models (synthetic data)
        run: |
          cd backend
          python scripts/train_models.py

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: API smoke test
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

          curl -f http://localhost:8000/health || exit 1

          curl -f -X POST http://localhost:8000/simulate \
            -H "Content-Type: application/json" \
            -d '{"inputs":{"age":28,"education_level":3,"years_experience":5,"study_hours_per_day":2,"work_hours_per_week":45,"savings_rate_pct":20,"exercise_days_per_week":3,"networking_hours_per_week":4,"skill_level":6,"sleep_hours_per_night":7,"social_media_hours_per_day":2,"risk_tolerance":5,"side_project_effort":3,"job_category":"technology","country":"USA"},"n_simulations":100,"years_horizon":10,"random_seed":42}' \
            || exit 1

          echo "All smoke tests passed!"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build check
        run: |
          cd frontend
          npm run build
